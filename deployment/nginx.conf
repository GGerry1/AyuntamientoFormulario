upstream django_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name tusitio.com www.tusitio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tusitio.com www.tusitio.com;

    # SSL — issued by Certbot
    ssl_certificate /etc/letsencrypt/live/tusitio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tusitio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=inscription:10m rate=5r/m;

    client_max_body_size 10M;

    # React frontend (static build)
    location / {
        root /var/www/cursogov/frontend/dist;
        try_files $uri /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Django API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inscription endpoint — stricter rate limit
    location ~* /api/v1/courses/inscripcion/ {
        limit_req zone=inscription burst=5 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth callbacks
    location /accounts/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static / Media
    location /static/ {
        alias /var/www/cursogov/backend/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /var/www/cursogov/backend/media/;
        expires 7d;
        # Prevent direct access to diplomas via URL
        location /media/diplomas/ {
            deny all;
        }
    }
}
